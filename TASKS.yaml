R3_REAL_SHAM_SUBJECT_BALANCED_INNER_DIAGNOSTIC:
  title: Inner-only source subject-item-balanced fit diagnostic
  stage: research_branch
  status: DONE
  priority: 1
  prerequisites:
    - origin/research/real-sham-r2-geometry-inner is a6fdf258ae89e4032e5e7afba61bba021fca186d
    - R2 outcome is FAIL_R2_GEOMETRY_INNER_DIAGNOSTIC with no scope violation
  methods:
    P0_OBSERVATION_WEIGHTED:
      definition: exact inherited pooled row-level ridge baseline
      role: immutable baseline replication
    P1_SUBJECT_ITEM_BALANCED:
      definition: source-fit-only equal-weight group means by (subject_id,item_id)
      role: sole inductive candidate
  basis: B0_RAW_A1
  target: Y0_RAW_MINILM
  alignment: M0_STRICT_INDUCTIVE
  exact_scope:
    tasks: [task1_nr, task2_tsr]
    outer_base_cell: outer_s0_t0
    inner_text_fold: t0
    inner_subject_folds: [s0, s1, s2]
    seed: 20260813
    arms:
      - real
      - trial_shuffle
      - within_trial_unit_assignment_shuffle
      - channel_block_permutation
    common_observation_min_retention: 0.90
  fit_group_rule:
    grouping_key: [subject_id, item_id]
    source_scope: fit_rows_only
    aggregate: arithmetic_mean_of_finite_EEG_rows_per_group
    group_weight: equal_per_group_in_ridge
    H_and_target: canonical_item_values_for_each_group
    scoring_rows: unchanged_individual_seen_and_cross_rows
    no_seen_cross_group_creation: true
  fit_budget:
    h_only_p0_fits: 6
    h_only_p1_fits: 6
    p0_probe_fits: 24
    p1_probe_fits: 24
    total_ridge_operations: 60
    unique_v5_ledgers: 60
    outer_test_reads: 0
    calibration_reads: 0
  acceptance:
    - P0 and P1 run on 2 tasks x 3 inner folds x 4 arms with identical
      scoring row identity and supported vocabulary.
    - P1 groups are constructed only from fit rows, with no subject/item
      grouping information from seen/cross rows entering the fit.
    - Primary semantic contrast, family thresholds and paired recovery rules
      are exactly inherited from R1/R2.
    - P1 is the only candidate; P0 is baseline replication.
    - Focused/related tests, compile, state/status, diff-check and all parent,
      R0, R1 and R2 hash checks pass.
  outcomes:
    candidate_pass: PASS_R3_SUBJECT_BALANCED_INNER
    no_candidate: FAIL_R3_SUBJECT_BALANCED_INNER_DIAGNOSTIC
    contract_failure: INVALID_R3_SUBJECT_BALANCED_INNER_DIAGNOSTIC
  forbidden:
    - Run outer confirmation, negative confirmation, A3, ROAMM, direct_u_plus,
      EQ_ANMA, alignment or a Gate.
    - Add a post-outcome weighting, group, basis, target or threshold variant.
  produces:
