    resolution: Inspect the raw channel labels/order, freeze an explicit map with coverage, and use it for the ET-free fixed-window sensitivity.
  - id: B_A1_NUMERIC_BAND_EDGES
    reason: v3.6 freezes the raw-unit Hann periodogram, nFFT, half-open integration, no-dB rule, and fold-local robust normalization, but it still names the eight bands without enumerating their exact numeric edges; current code edges are an engineering configuration only.
    blocks:
      - S0_A1_ADMISSION
      - S0_ALIGN_UNIT_COST
    resolution: Author-approve the eight numeric frequency intervals and register them without changing the already frozen PSD/window/unit formula before paper-level admission.
  - id: B_TMNRED_EXPERIMENT_PROTOCOL
    reason: Structural TMNRED data-card audit is complete, but experiment protocol is not cleared; released word-level lexical content is absent, demographics are unusable, one subject-session is incomplete, license metadata disagree, and session/candidate/joint-split rules are pending.
    blocks:
      - S0_CANDIDATES
      - S0_LEAKAGE_AUDIT
    resolution: Obtain released lexical/event linkage or record a bounded TMNRED semantic No-Go, then resolve the incomplete cell, license discrepancy, session policy, candidate policy, and joint subject-stimulus split; do not tokenize, translate, or infer missing lexical items.
  - id: B_A3_NOT_VALIDATED
    reason: v3.6 clears CO-N7 and treats local checkpoint inference rights as a disclosure item; checkpoint/load/pooling/no-gradient and raw E1..E128 inventory pass, but the EGI128-to-canonical map, ZuCo raw unit, filter order/notch Q, and real MAT end-to-end extraction remain unresolved.
    blocks:
      - S0_A3_CONTAMINATION_CHECK
    resolution: Approve and hash an exact-name or spatial EGI128-to-canonical map with coverage, verify the raw signal unit, freeze filter order/notch Q, then run the real 500-to-200 preprocessing and no-gradient 200D extraction smoke. Preserve checkpoint provenance and do not redistribute the checkpoint.

