    reason: SPEC v3.15 preserves ROAMM ds007629 v1.3.0 as the mandatory external replication dataset but defers it until the ZuCo2 first-dataset package is frozen. Because A1 admission failed, that package now means the construct-validity diagnosis plus the separately frozen full 6x5 negative-confirmation panel, not the unavailable EQ-ANMA main experiment. The existing incomplete checkpoint remains not experiment-ready.
