blockers:
  - id: B_ZUCO2_N50_STRUCTURAL_NO_GO
    reason: The complete frozen ZuCo2 outer-test and inner-validation audit retained all 18,475 targets, but 18,184 have fewer than the 49 legal negatives required for N=50 after the exact scope, inclusive token-length, strict cosine and H-source filters. This is a protocol-level structural No-Go, not a failed build.
    blocks:
      - S0_LEAKAGE_AUDIT
      - S0_DIRECT_U_PLUS
    resolution: AUTHOR_REVIEW_N50_PROTOCOL. The author must decide a new protocol in a future specification revision; do not change N, candidate sources, hard filters or target retention under v3.10, and do not start leakage or downstream method implementation meanwhile.
  - id: B_A1_REAL_SOURCE_ADMISSION
    reason: v3.8 inherits the frozen numeric band edges and 105-channel sentenceData.rawData source for ZuCo2 ET-free A1 sensitivity, but real-file sampling rate, channel order, units, finite values, and field semantics have not been admitted end to end.
    blocks:
      - S0_A1_ADMISSION
      - S0_ALIGN_UNIT_COST
    resolution: Verify the real MAT source contract and run the A1 frontend/self-check on outer-train data. The 128-to-105 map is not an A1 prerequisite; it remains only for A3 or a separately preregistered raw-source sensitivity.
  - id: B_ROAMM_DEFERRED_UNTIL_ZUCO2_FREEZE
    reason: SPEC v3.9 preserves ROAMM ds007629 v1.3.0 as the mandatory external replication dataset but defers all further ROAMM work until the ZuCo2 main experiment, method table, thresholds and route are frozen. The existing incomplete download/admission checkpoint is retained and is not experiment-ready.
    blocks:
      - S0_ROAMM_ADMISSION
    resolution: After MAIN_EXPERIMENT is DONE for ZuCo2, remove this scheduling blocker and resume S0_ROAMM_ADMISSION from the preserved checkpoint under the frozen v3.9 replication contract. Do not select, cancel or redesign replication based on the ZuCo2 outcome.
  - id: B_A3_NOT_VALIDATED
    reason: v3.6 clears CO-N7 and treats local checkpoint inference rights as a disclosure item; checkpoint/load/pooling/no-gradient and raw E1..E128 inventory pass, but the EGI128-to-canonical map, ZuCo raw unit, filter order/notch Q, and real MAT end-to-end extraction remain unresolved.
    blocks:
      - S0_A3_CONTAMINATION_CHECK
    resolution: Approve and hash an exact-name or spatial EGI128-to-canonical map with coverage, verify the raw signal unit, freeze filter order/notch Q, then run the real 500-to-200 preprocessing and no-gradient 200D extraction smoke. Preserve checkpoint provenance and do not redistribute the checkpoint.

