blockers:
  - id: B_INNER_SPLIT_NOT_IMPLEMENTED
    reason: The deterministic outer 6x5 ZuCo2 split exists, but v3.7 requires a separate 4x4 (or globally downgraded 3x3) inner split inside every outer-train cell; no such artifact or overlap test exists.
    blocks:
      - S0_CANDIDATES
      - S0_LEAKAGE_AUDIT
    resolution: Generate deterministic subject/text inner folds from outer-train only, record the global downgrade decision, and prove every inner train/validation set is disjoint from its outer test set.
  - id: B_ZUCO2_CANDIDATE_FEASIBILITY
    reason: Current held-out text folds contain only 69-70 NR or 78 TSR sentences before filtering. N=100/200 are impossible under the legal unseen-text pool, and N=50 has not been verified per target after length, near-duplicate, and H-overlap filtering.
    blocks:
      - S0_LEAKAGE_AUDIT
    resolution: After the frozen text encoder and inner split are admitted, build target-level feasibility ledgers and shared candidate lists; require at least 49 legal negatives for every included main target and emit a blocker rather than relaxing source/filter rules.
  - id: B_A1_REAL_SOURCE_ADMISSION
    reason: v3.7 closes numeric band edges and selects 105-channel sentenceData.rawData for the ET-free A1 sensitivity, but real-file sampling rate, channel order, units, finite values, and field semantics have not been admitted end to end.
    blocks:
      - S0_A1_ADMISSION
      - S0_ALIGN_UNIT_COST
    resolution: Verify the real MAT source contract and run the A1 frontend/self-check on outer-train data. The 128-to-105 map is not an A1 prerequisite; it remains only for A3 or a separately preregistered raw-source sensitivity.
  - id: B_TMNRED_EXPERIMENT_PROTOCOL
    reason: Structural TMNRED data-card audit is complete, but experiment protocol is not cleared; released word-level lexical content is absent, demographics are unusable, one subject-session is incomplete, license metadata disagree, and session/candidate/joint-split rules are pending.
    blocks:
      - S0_TMNRED_PROTOCOL
    resolution: Resolve only before admitting the TMNRED supplementary panel or CSPE. Under v3.7 D11 it must not block ZuCo2 candidates, leakage, A1 admission, Stage 1, or the minimum single-dataset paper package.
  - id: B_A3_NOT_VALIDATED
    reason: v3.6 clears CO-N7 and treats local checkpoint inference rights as a disclosure item; checkpoint/load/pooling/no-gradient and raw E1..E128 inventory pass, but the EGI128-to-canonical map, ZuCo raw unit, filter order/notch Q, and real MAT end-to-end extraction remain unresolved.
    blocks:
      - S0_A3_CONTAMINATION_CHECK
    resolution: Approve and hash an exact-name or spatial EGI128-to-canonical map with coverage, verify the raw signal unit, freeze filter order/notch Q, then run the real 500-to-200 preprocessing and no-gradient 200D extraction smoke. Preserve checkpoint provenance and do not redistribute the checkpoint.

