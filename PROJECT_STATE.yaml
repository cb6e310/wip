blockers:
  - id: B_ZUCO2_CHANNEL_MAP
    reason: ZuCo 2.0 word-level summary EEG has 105 channels, while continuous EEGLAB files have 128 channels; no verified 128-to-105 channel order/drop map is present.
    blocks:
      - S0_A1_ADMISSION
      - S0_ALIGN_UNIT_COST
    resolution: Inspect the raw channel labels/order, freeze an explicit map with coverage, and use it for the ET-free fixed-window sensitivity.
  - id: B_A1_BANDPOWER_FORMULA
    reason: The guide names eight bands but does not fully freeze the exact frequency edges, PSD window, and signal-unit convention; the implementation records the legacy smoke convention as provisional.
    blocks:
      - S0_A1_ADMISSION
      - S0_ALIGN_UNIT_COST
    resolution: Author-approve the band edges/window/unit convention and add it to the data-card/protocol artifact before paper-level admission.
  - id: B_TMNRED_EXPERIMENT_PROTOCOL
    reason: Structural TMNRED data-card audit is complete, but experiment protocol is not cleared; demographics are unusable, one subject-session is incomplete, license metadata disagree, and joint split/session/candidate rules are pending.
    blocks:
      - S0_CANDIDATES
      - S0_JOINT_SPLIT
      - S0_LEAKAGE_AUDIT
    resolution: Resolve the incomplete cell, license discrepancy, session policy, candidate policy, and joint subject-stimulus split; retain the completed structural card as evidence.
  - id: B_ZUCO2_REFERENCE_EXCLUSIONS
    reason: Full audit counts malformed, placeholder, missing word groups and nested fixation leaves, but no sample exclusion or imputation rule is frozen.
    blocks:
      - S0_JOINT_SPLIT
      - S0_A1_ADMISSION
      - S0_LEAKAGE_AUDIT
    resolution: Author-approve and register the exclusion and empty-reference policy before fitting normalization, probes, or splits.
  - id: B_ZUCO2_STIMULUS_JOIN
    reason: All summary sentence texts match the material sequence across subjects, but duplicate source-text slots remain ambiguous (NR=10, TSR=34); no paragraph/sentence ID join is selected.
    blocks:
      - S0_CANDIDATES
      - S0_JOINT_SPLIT
      - S0_LEAKAGE_AUDIT
    resolution: Verify paragraph_id and sentence_id correspondence and freeze a deterministic identity join before candidate or split construction.
  - id: B_SEMANTIC_ITEM_UNRESOLVED
    reason: The guide permits content-word type or semantic cluster, but the project has not frozen one choice against ZuCo 2.0 support counts.
    blocks:
      - S0_SEMANTIC_ITEM
    resolution: Complete the ZuCo 2.0 data card, compare support coverage, and freeze one item definition before Stage-1 probes.
  - id: B_GATE_A_POPULATION_E5
    reason: Unified spec Appendix E-5 leaves the Gate A pilot statistical population unresolved.
    blocks:
      - S0_GATE_A_POPULATION_E5
    resolution: Record an author-approved outer-training-OOF or multi-outer-cell population rule before Gate A.
  - id: B_A4_SPEC_CONFLICT
    reason: The requested third backbone A4 is not defined in the v3.4 guide; section 4.7 freezes A1/A3 and says not to substitute a third backbone.
    blocks:
      - S0_A4_DEFINITION
    resolution: Obtain an explicit author decision and a guide-level definition before adding A4 to active backbones or any experiment.
  - id: B_A3_NOT_VALIDATED
    reason: LaBraM-Base checkpoint bytes/hash, official release pooling/load contract, required runtime modules, and the 252-file raw E1..E128 order now pass engineering checks; CO-N7 corpus exclusion, checkpoint/corpus rights, an approved EGI128-to-canonical map, and real EEG end-to-end extraction remain unresolved.
    blocks:
      - S0_A3_CONTAMINATION_CHECK
    resolution: Obtain a corpus-level no-ZuCo/natural-reading attestation, record checkpoint and corpus rights, approve and hash an exact-name or spatial EGI128-to-canonical map with coverage, then run the real 500-to-200 preprocessing and no-gradient 200D extraction smoke.

